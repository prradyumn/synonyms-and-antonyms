<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Say It Another Way — v2, carry the word</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#101E19;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:"Segoe UI",Roboto,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;padding:12px}
#wrap{width:880px;max-width:100%}
#frame{position:relative;width:100%;aspect-ratio:880/495;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#7FC46C;touch-action:none}
.abs{position:absolute}
#bg,#bg2{position:absolute;inset:0;background-size:cover;background-position:center}
#bg2{opacity:0;transition:opacity 1s}
#fx,#air{position:absolute;inset:0;pointer-events:none}
#hud{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:7px;padding:0 14px;background:linear-gradient(rgba(255,255,255,.84),rgba(255,255,255,.4));z-index:8}
.pip{width:20px;height:8px;border-radius:4px;background:rgba(0,0,0,.16);transition:background .4s}
.pip.on{background:#2F8F4E}
.sp{flex:1}
.sh{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:#7A5A12}
.sh svg{width:17px;height:17px}
#ask{position:absolute;left:50%;transform:translateX(-50%);top:54px;max-width:76%;background:rgba(255,255,255,.94);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:600;color:#22322A;text-align:center;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.13);z-index:8;display:flex;align-items:center;gap:9px}
#ask svg{width:18px;height:18px;flex:none;color:#2F8F4E}
#spk{border:none;background:none;padding:0;cursor:pointer;display:flex}
.ch{position:absolute;bottom:10px;height:152px;z-index:4;transition:transform .4s}
.ch.tur{height:128px}
.sign{position:absolute;z-index:5;width:168px;animation:bob 2.6s ease-in-out infinite}
.vine{position:absolute;left:0;right:0;bottom:112px;height:22px;z-index:5;pointer-events:none}
.tag{position:absolute;width:150px;z-index:6;cursor:grab;transform-origin:50% 4%}
.tag.sway{animation:sway 3.1s ease-in-out infinite}
.tag.held{cursor:grabbing;animation:none;z-index:20;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.tag.gone{pointer-events:none}
.ring{position:absolute;z-index:5;pointer-events:none}
.verd{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;background:rgba(18,38,26,.8);color:#fff;border-radius:12px;padding:7px 16px;font-size:14px;font-weight:700;z-index:9;white-space:nowrap;animation:rise .4s}
.node{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;z-index:6}
.node.doneN{background:#2F8F4E;box-shadow:0 3px 0 #1E6236}
.node.cur{background:#E8912A;box-shadow:0 0 0 5px rgba(255,255,255,.78),0 3px 0 #B96A12;cursor:pointer;animation:pulse 1.4s infinite}
.node.lockN{background:rgba(50,62,44,.42)}
.over{position:absolute;inset:0;background:rgba(255,253,245,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;padding:26px;z-index:12}
.over h3{margin:0;font-size:25px;color:#1B3324}
.over p{margin:0;font-size:14.5px;color:#5E6A5C;line-height:1.55;max-width:540px}
.btn{border:none;background:#2F8F4E;color:#fff;font-weight:700;font-size:16px;padding:14px 30px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #1E6236}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:600px}
.chips span{background:#2F8F4E;color:#fff;border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:700}
.ff{position:absolute;width:18px;height:18px;z-index:3;animation:ffly 3.4s ease-in-out infinite}
.fruit{position:absolute;width:22px;height:22px;z-index:3;transform-origin:50% 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.sheet{position:absolute;z-index:2;animation:shimmer 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3.6deg)}50%{transform:rotate(3.6deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ffly{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-12px)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:.95}}
@keyframes grow{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.wob{animation:wob .5s}
#note{max-width:880px;margin:13px auto 0;color:#8FA394;font-size:12.5px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div id="wrap">
<div id="frame">
  <div id="bg"></div><div id="bg2"></div><div id="fx"></div>
  <div id="hud"><div id="pips" style="display:flex;gap:6px"></div><span class="sp"></span>
    <span class="sh"><svg viewBox="0 0 100 100"><path d="M50 88C26 88 8 64 8 42a42 42 0 0 1 84 0c0 22-18 46-42 46z" fill="#F2B01E"/><path d="M50 84V16M50 84L22 34M50 84l28-50" stroke="#C98B0E" stroke-width="5" fill="none"/></svg><b id="shn">0</b></span></div>
  <div id="ask"><button id="spk"><svg viewBox="0 0 100 100"><path d="M20 38h16l20-16v56L36 62H20z" fill="currentColor"/><path d="M66 34a22 22 0 0 1 0 32M77 23a37 37 0 0 1 0 54" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></button><span id="asktxt"></span></div>
  <div id="air"></div>
</div>
<p id="note">Version 2 — the answers are carved tags hanging on a vine. Pull one off and carry it to the friend who did not understand. Tapping still works.</p>
</div>

function later(f,ms){const g=GEN,i=setTimeout(()=>{if(g===GEN)f()},ms);T.push(i);return i}
function kill(){T.forEach(i=>{clearTimeout(i);clearInterval(i)});T=[]}
let ac=null;
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.13;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
let said='';
function speak(t){said=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.87;u.pitch=1.05;const v=speechSynthesis.getVoices().find(v=>/en-IN|India/i.test(v.lang+v.name))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
$('#spk').onclick=()=>speak(said);
function ask(t){$('#asktxt').textContent=t;speak(t)}

 }
}

 FX.appendChild(el('<div class="abs sheet" style="left:43.5%;top:27%;width:13%;height:34%;background:linear-gradient(rgba(255,255,255,.92),rgba(158,226,242,.86));border-radius:7px 7px 0 0"></div>'));
 FX.appendChild(el('<div class="abs sheet" style="left:27%;top:56%;width:47%;height:17%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,215,235,.94),rgba(90,190,215,.82));animation-delay:.6s"></div>'));
 FX.appendChild(el('<div class="abs sheet" style="left:41%;top:55%;width:19%;height:8%;border-radius:50%;background:rgba(255,255,255,.88);animation-delay:1.1s"></div>'));
}
function fxCheer(){[0,1,2].forEach(i=>later(()=>sparkle(F.clientWidth*(.3+i*.2),F.clientHeight*.42),i*230))}
const FXMAP={glow:fxGlow,fruit:fxFruit,water:fxWater,cheer:fxCheer};

/* ---------- intro ---------- */
function intro(){
 clean();cur=0;pips();setbg('bridge_broken');
 chip('mon','left:5%');chip('tur','left:23%');chip('ele','left:39%');
 F.appendChild(svg(vineSVG()));
 const go=svg(tagSVG('start',0));go.style.left='60%';go.style.bottom='24px';
 go.onclick=()=>map();F.appendChild(go);
 ask('Three friends. Six places. Someone always needs another word.');
}

/* ---------- map ---------- */
const POCK=[[20,31],[45,30],[71,31],[71,70],[46,71],[26,70]];
function map(){
 clean();pips();setbg('map');
 if(cur>=L.length)return finishAll();
 L.forEach((_,k)=>{
  const cls=k<cur?'doneN':(k===cur?'cur':'lockN');
  const n=el('<div class="node '+cls+'" style="left:'+POCK[k][0]+'%;top:'+POCK[k][1]+'%">'+(k<cur?'\u2713':(k+1))+'</div>');
  if(k===cur)n.onclick=()=>level(cur);
  F.appendChild(n);
 });
 ask('Tap the glowing spot. Place '+(cur+1)+' of 6.');
}

/* ---------- a level ---------- */
function level(k){
 clean();pips();const r=L[k];setbg(r.bg);
 chip(r.say,'left:4%');const hr=chip(r.hear,'right:4%');
 const sg=svg(signSVG(r.w));sg.style.left='3%';sg.style.bottom='168px';F.appendChild(sg);
 F.appendChild(svg(vineSVG()));
 ask(NAME[r.say]+' says '+r.w+'. Carry another word that means the same to '+NAME[r.hear]+'.');
 let live=true;
 const opts=[r.syn,r.ant,r.un].sort(()=>Math.random()-.5);
 const xs=['27%','45.5%','64%'];
 opts.forEach((w,i)=>{
  const t=svg(tagSVG(w,i));t.style.left=xs[i];t.style.bottom='6px';
  F.appendChild(t);
  let held=false,sx=0,sy=0,ox=0,oy=0,moved=0;
  const home=()=>{t.style.transform='';t.classList.add('sway');t.classList.remove('held')};
  const land=()=>{
   const fr=F.getBoundingClientRect(),tb=t.getBoundingClientRect();
   const hb=hr.getBoundingClientRect();
   const cx=hb.left+hb.width/2-fr.left, cy=hb.top+hb.height*0.42-fr.top;
   const nx=cx-(tb.left+tb.width/2-fr.left), ny=cy-(tb.top+tb.height/2-fr.top);
   if(w===r.syn){
    live=false;t.classList.add('gone');
    t.animate([{transform:t.style.transform||'none'},
      {transform:`translate(${ox+nx*0.5}px,${oy+ny-70}px) rotate(-12deg)`,offset:.55},
      {transform:`translate(${ox+nx}px,${oy+ny}px) rotate(6deg)`}],
      {duration:700,easing:'cubic-bezier(.3,.1,.4,1)',fill:'forwards'}).onfinish=()=>{
       ringAt(cx,cy);sparkle(cx-9,cy-9);tone(660,.24);
       t.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});
       hr.style.transform='translateX(-34px) scale(1.07)';
       if(r.after){BG2.style.backgroundImage='url('+A[r.after]+')';BG2.style.opacity='1'}
       if(r.fx&&FXMAP[r.fx])FXMAP[r.fx]();
       shells++;streak++;$('#shn').textContent=shells;
       if(!kept.includes(r.w+' = '+r.syn))kept.push(r.w+' = '+r.syn);
       F.appendChild(el('<div class="verd">'+r.w+' and '+r.syn+' mean the same</div>'));
       speak(r.w+'. '+r.syn+'. Same meaning. '+r.ok);
       later(()=>{cur=k+1;map()},4300);
      };
   } else if(w===r.ant){
    tone(300,.14);streak=0;t.classList.remove('sway');
    t.animate([{transform:t.style.transform||'none'},
      {transform:`translate(${ox+nx*0.86}px,${oy+ny}px) rotate(8deg)`,offset:.45},
      {transform:'none'}],{duration:1200,easing:'ease-in-out'}).onfinish=home;
    hr.classList.add('wob');later(()=>hr.classList.remove('wob'),520);
    speak(r.antL);
   } else {
    tone(230,.16);streak=0;t.classList.remove('sway');
    t.animate([{transform:t.style.transform||'none',opacity:1},
      {transform:`translate(${ox}px,${oy+180}px) rotate(46deg)`,opacity:0}],
      {duration:800,easing:'cubic-bezier(.4,0,.8,.4)',fill:'forwards'}).onfinish=()=>{
       t.style.transform='';t.style.animation='grow .55s cubic-bezier(.3,1.5,.5,1) both';
       t.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'});
       later(()=>{t.style.animation='';t.classList.add('sway')},600);
      };
    speak(r.unL);
   }
  };
  t.addEventListener('pointerdown',e=>{
   if(!live)return;held=true;moved=0;sx=e.clientX;sy=e.clientY;
   t.classList.remove('sway');t.classList.add('held');
   try{t.setPointerCapture(e.pointerId)}catch(x){}
  });
  t.addEventListener('pointermove',e=>{
   if(!held||!live)return;ox=e.clientX-sx;oy=e.clientY-sy;
   moved=Math.max(moved,Math.abs(ox)+Math.abs(oy));
   t.style.transform=`translate(${ox}px,${oy}px) scale(1.06) rotate(${ox*0.03}deg)`;
  });
  const up=e=>{
   if(!held||!live)return;held=false;t.classList.remove('held');
   const fr=F.getBoundingClientRect(),tb=t.getBoundingClientRect();
   const centre=tb.left+tb.width/2-fr.left;
   if(moved<14){ox=0;oy=0;t.style.transform='';land();return}
   if(centre>fr.width*0.58){land()}
   else{t.animate([{transform:t.style.transform},{transform:'none'}],{duration:340,easing:'cubic-bezier(.3,1.3,.6,1)'}).onfinish=home}
  };
  t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
 });
}

/* ---------- ending ---------- */
function finishAll(){
 clean();pips();setbg('falls');fxWater();
 chip('ele','left:6%');chip('tur','left:26%');chip('mon','left:44%');
 F.appendChild(el('<div class="over"><h3>The spring is back!</h3><p>Six places, six pairs. Every one of them was two different words carrying the same meaning.</p><div class="chips">'+kept.map(x=>'<span>'+x+'</span>').join('')+'</div><button class="btn">Walk it again</button></div>'));
 F.querySelector('.btn').onclick=()=>{shells=0;streak=0;kept.length=0;$('#shn').textContent=0;intro()};
 speak('The spring is back. Six pairs of words that mean the same.');
}

try{speechSynthesis.getVoices()}catch(e){}
intro();
</script>
</body>
</html>
